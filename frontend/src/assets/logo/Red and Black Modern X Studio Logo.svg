<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991B1B;stop-opacity:1" />
    </linearGradient>
    
    <filter id="shadow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Black background circle -->
  <circle cx="100" cy="100" r="95" fill="#000000"/>
  
  <!-- Modern X Design - Red gradient -->
  <g filter="url(#shadow)">
    <!-- Primary X line -->
    <path d="M 50 50 L 150 150" 
          stroke="url(#redGrad)" 
          stroke-width="12" 
          fill="none" 
          stroke-linecap="round"
          opacity="1"/>
    
    <!-- Secondary X line -->
    <path d="M 150 50 L 50 150" 
          stroke="url(#redGrad)" 
          stroke-width="12" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9"/>
  </g>
  
  <!-- Center circle accent -->
  <circle cx="100" cy="100" r="18" fill="url(#redGrad)" opacity="0.8"/>
  <circle cx="100" cy="100" r="12" fill="#EF4444"/>
  <circle cx="100" cy="100" r="7" fill="#000000" opacity="0.3"/>
  
  <!-- Corner accent dots -->
  <g opacity="0.7">
    <circle cx="40" cy="40" r="5" fill="#EF4444"/>
    <circle cx="160" cy="160" r="5" fill="#EF4444"/>
    <circle cx="160" cy="40" r="5" fill="#EF4444"/>
    <circle cx="40" cy="160" r="5" fill="#EF4444"/>
  </g>
</svg>