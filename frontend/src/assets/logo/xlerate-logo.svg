<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Aqua Flow Gradient - Cyan to Turquoise to Aqua -->
    <linearGradient id="aquaFlowX" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891B2;stop-opacity:1" />
    </linearGradient>
    
    <!-- Secondary gradient for depth -->
    <linearGradient id="aquaFlowX-alt" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0891B2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#14B8A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Red accent for contrast (from your design) -->
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glowX">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#E0F2FE" stroke-width="1" opacity="0.5"/>
  
  <!-- Modern X Design with Aqua & Red -->
  <g filter="url(#glowX)">
    <!-- Primary X line with aqua flow -->
    <path d="M 55 55 L 145 145" 
          stroke="url(#aquaFlowX)" 
          stroke-width="10" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.95"/>
    
    <!-- Secondary X line with red accent -->
    <path d="M 145 55 L 55 145" 
          stroke="url(#redAccent)" 
          stroke-width="10" 
          fill="none" 
          stroke-linecap="round"
          opacity="0.9"/>
  </g>
  
  <!-- Central circle accent with aqua -->
  <circle cx="100" cy="100" r="16" fill="url(#aquaFlowX)" opacity="0.8"/>
  <circle cx="100" cy="100" r="11" fill="#06B6D4" opacity="0.95"/>
  <circle cx="100" cy="100" r="6" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Corner accents -->
  <g opacity="0.6" filter="url(#glowX)">
    <!-- Top-left aqua accent -->
    <circle cx="45" cy="45" r="4" fill="url(#aquaFlowX)"/>
    <!-- Bottom-right aqua accent -->
    <circle cx="155" cy="155" r="4" fill="url(#aquaFlowX)"/>
    <!-- Top-right red accent -->
    <circle cx="155" cy="45" r="4" fill="url(#redAccent)"/>
    <!-- Bottom-left red accent -->
    <circle cx="45" cy="155" r="4" fill="url(#redAccent)"/>
  </g>
</svg>